# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 319 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 319 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 409 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
  l: [1.00, 1.00, 512] # summary: 631 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
  x: [1.00, 1.50, 512] # summary: 631 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs
fusion_mode: bifpn
node_mode: C3k2
head_channel: 256

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  # C3k2_LFEM args: [c2, c3k, e, g, shortcut, gaussian_size, gaussian_sigma]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2_LFEM, [256, False, 0.25, 1, True, 5, 0.5]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2_LFEM, [512, False, 0.25, 1, True, 5, 0.5]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2_LFEM, [512, True, 0.5, 1, True, 5, 0.5]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2_LFEM, [1024, True, 0.5, 1, True, 5, 0.5]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11n head
head:
  - [2, 1, Conv, [head_channel]]  #11-p2/4
  - [4, 1, Conv, [head_channel]]  # 12-P3/8
  - [6, 1, Conv, [head_channel]]  # 13-P4/16
  - [10, 1, Conv, [head_channel]]  # 14-P5/32

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 15 P5->P4
  - [[-1, 13], 1, Fusion, [fusion_mode]] # 16
  - [-1, 3, node_mode, [head_channel, False]] # 17-P4/16

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 18 P4->P3
  - [[-1, 12], 1, Fusion, [fusion_mode]] # 19
  - [-1, 3, node_mode, [head_channel, False]] # 20-P3/8

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] #21-P3->P2
  - [[-1, 11], 1, Fusion, [fusion_mode]]
  - [-1, 3, node_mode, [head_channel, False]] # 23-P2/4

  - [2, 1, Conv, [head_channel, 3, 2]] # 24-P2->P3
  - [[-1, 12, 20], 1, Fusion, [fusion_mode]] # 25
  - [-1, 3, node_mode, [head_channel, False]] # 26-P3/8

  - [-1, 1, Conv, [head_channel, 3, 2]] # 27-P3->P4
  - [[-1, 13, 17], 1, Fusion, [fusion_mode]] # 28
  - [-1, 3, node_mode, [head_channel, False]] # 29-P4/16

  - [[23, 26, 29], 1, Detect_LSDDH, [nc, 256]] # Detect(P2, P3, P4)
